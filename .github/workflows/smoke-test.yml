name: smoke-test

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "scripts/**"
      - "skills/cumulus/**"
      - "skills.sh.json"
      - "VERSION"
      - ".github/workflows/smoke-test.yml"
  pull_request:
    paths:
      - "install.sh"
      - "scripts/**"
      - "skills/cumulus/**"
      - "skills.sh.json"
      - "VERSION"
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch:

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Python version
        run: python3 --version
      - name: Run smoke test
        run: bash scripts/smoke-test.sh
